<h2>MARCAS</h2>
@if (loading) {
  <app-loading></app-loading>
}
@if (!loading) {
  <div id="container">
    @for (brand of brandsArray; track brand) {
      <div routerLink="/brands/products/{{brand.name}}" id="brand-item" [ngStyle]="{'background-image': 'url(' + brand.image + ')'}">
      </div>
    }
  </div>
}
