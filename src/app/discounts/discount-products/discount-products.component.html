@if (loading) {
  <app-loading></app-loading>
}
@if (!loading) {
  <div id="containsProducts">
    @for (product of products; track product) {
      <div class="products">
        <p>{{product.name}}</p>
        <p>{{product.brand}}</p>
        <p>{{product.category}}</p>
        @if (product.discount > 0) {
          <p>Tiene descuento</p>
        }
        @if (product.discount > 0) {
          <p>Descuento: {{product.discount}}</p>
        }
      </div>
    }
  </div>
}
