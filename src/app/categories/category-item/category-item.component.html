
<body>
  <h2>CATEGORIAS</h2>
  <div id="container">
    @for (category of categories; track category) {
      <div (click)="selectCategory(category.name)" routerLink="/categories/{{category.name}}" id="category-item" [ngStyle]="{'background-image': 'linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.3)), url(' + category.image + ')'}" draggable="false">
        <p id="cat-name">{{category.name}}</p>
      </div>
    }
  </div>
</body>
