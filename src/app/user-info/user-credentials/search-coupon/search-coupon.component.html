<div id="container">
  <h2>BUSCAR CUPÓN POR CODIGO</h2>
  <div id="form">
    <label for="couponName">Ingrese el código del cupon</label>
    <input type="text" name="couponName" id="couponNameInp">
    <button (click)="searchCoupon()">Buscar</button>
    @if (notFound) {
      <p>Cupón no encontrado</p>
    }
  </div>

  <div id="couponList">
    <H2>LISTA DE CUPONES</H2>
    @for (coupon of coupons; track coupon) {
      <p [ngClass]="{'expired': expired(coupon.expires)}">{{coupon.code}} | Expira: {{getDate(coupon.expires)}}</p>
    }
  </div>
</div>
