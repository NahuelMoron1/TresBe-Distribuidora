<div id="container">
  <h1>ULTIMAS COMPRAS</h1>
  @for (oap of oxpHtml; track oap) {
    <div class="items" (click)="changeDisplay('myOrders', oap.order.id)">
      <div id="dateCode">
        <p>#{{oap.order.code}}</p>
        <p>{{getDates(oap.order.orderDate)}}</p>
      </div>
      @for (product of oap.products; track product) {
        <div>
          <p>{{product.name}} x{{product.quantity}}</p>
        </div>
      }
      <p>PRECIO TOTAL: {{oap.order.total}}</p>
    </div>
  }
</div>
