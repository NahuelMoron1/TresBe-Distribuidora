<div id="container">
  @if (!(user.client)) {
    <button [routerLink]="['/checkout/id/proofment']">Ya hice la transferencia</button>
  }
  @if (user.email != '' && user.client) {
    <button (click)="setLater()" [routerLink]="['/user']">Ver mis pedidos</button>
  }
  <button id="cancel" (click)="cancelOrder()">Quiero cancelar mi pedido</button>
</div>
